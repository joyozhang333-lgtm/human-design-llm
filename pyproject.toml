[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "human-design-llm"
version = "0.6.1"
description = "Open-source Human Design AI product, BodyGraph engine, grounded reading generator, Web API, and installable agent skill."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Zhang Zhaoyang" }
]
keywords = [
  "human design",
  "human design ai",
  "human design llm",
  "human design chart",
  "human design chart calculator",
  "human design reading generator",
  "human design web app",
  "human design api",
  "human design body energy",
  "human design talent reading",
  "human design deep reading",
  "bodygraph",
  "bodygraph python",
  "bodygraph chart generator",
  "ai astrology",
  "ai agent",
  "llm toolkit",
  "llm skill",
  "codex skill",
  "human design reading",
  "career reading",
  "relationship chart",
  "transit analysis",
  "empirical validation",
  "blind test",
  "holdout benchmark",
  "prospective prediction",
  "source citations",
  "research grounded reading",
  "人类图",
  "人类图排盘",
  "人类图解读",
  "人类图网页产品",
  "人类图 Web App",
  "人类图身体能量",
  "人类图天赋解读",
  "人类图深度解读",
  "人类图职业解读",
  "人类图合盘",
  "人类图 AI"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Chinese (Simplified)",
  "Natural Language :: English",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Human Machine Interfaces",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Text Processing :: Linguistic"
]
dependencies = [
  "pyhd @ git+https://github.com/ppo/pyhd.git@main",
  "tzdata>=2024.1"
]

[project.optional-dependencies]
web = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0"
]
dev = [
  "pytest>=8.0.0",
  "fastapi>=0.110.0",
  "httpx>=0.27.0",
  "uvicorn[standard]>=0.27.0"
]

[project.urls]
Homepage = "https://github.com/joyozhang333-lgtm/human-design-llm"
Demo = "https://humandesign.guichu.chat"
Repository = "https://github.com/joyozhang333-lgtm/human-design-llm"
Issues = "https://github.com/joyozhang333-lgtm/human-design-llm/issues"
Changelog = "https://github.com/joyozhang333-lgtm/human-design-llm/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["human_design*"]

[tool.setuptools.package-data]
human_design = [
  "assets/*.svg",
  "assets/research-corpus/v0.3/*.json"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
